server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nexacrm.io www.nexacrm.io;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 20M;

    # WebSocket upgrade support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # ── API routes ──────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=global burst=50 nodelay;
        proxy_pass http://api_upstream;
    }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api_upstream;
    }

    location /api/v1/webhooks/ {
        # No rate limit on webhooks — Meta retries are legitimate
        proxy_pass http://api_upstream;
    }

    location /health {
        proxy_pass http://api_upstream/health;
        access_log off;
    }

    # Socket.IO — WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Swagger docs (disable in prod if desired)
    location /docs {
        proxy_pass http://api_upstream/docs;
    }

    # ── Frontend routes ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://web_upstream;
    }

    # Next.js static assets with long cache
    location /_next/static/ {
        proxy_pass http://web_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
